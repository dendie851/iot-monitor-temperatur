version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # Port MQTT untuk ESP32
      - "9001:9001"   # Port MQTT over WebSockets untuk Web Dashboard
    volumes:
      - ./mosquitto/config:/mosquitto/config

  web:
    image: php:apache
    container_name: web-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"     # Akses web via http://localhost:8080
    volumes:
      - ./html:/var/www/html   # <-- Mounting folder HTML lokal ke folder root Apache di container